name: jagex-webshare-replacer
version: 0.3.0.1

dependencies:
- base >= 4.7 && < 5
- text
- bytestring
- base64-bytestring
- string-interpolate
- req
- http-client
- http-client-tls
- http-types
- aeson
- aeson-pretty
- mtl
- transformers
- pretty-terminal
- terminal-progress-bar
- directory
- extra
- unliftio
- vector
- regex-tdfa
- retry
- hashable
- unordered-containers
- haskeline
- crypton-connection
- data-default
- optics

ghc-options:
  -Wall
  -Wno-name-shadowing
  -Wno-missing-signatures
  -Wno-type-defaults
  -Wunused-imports

default-extensions:
  - DataKinds
  - DeriveAnyClass
  - DeriveGeneric
  - DerivingStrategies
  - DuplicateRecordFields
  - EmptyDataDecls
  - ExplicitNamespaces
  - FlexibleContexts
  - GeneralizedNewtypeDeriving
  - LambdaCase
  - MultiParamTypeClasses
  - NegativeLiterals
  - NumericUnderscores
  - OverloadedLabels
  - OverloadedStrings
  - OverloadedRecordDot
  - PolyKinds
  - QuasiQuotes
  - RankNTypes
  - ScopedTypeVariables
  - StrictData
  - TemplateHaskell
  - TypeApplications
  - TypeOperators

library:
  source-dirs: src

executables:
  jagex-webshare-replacer:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -flate-specialise
    - -fspecialise-aggressively
    dependencies:
    - jagex-webshare-replacer